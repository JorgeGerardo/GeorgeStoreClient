<main>
    <h6 class="fw-bold mb-2">
    <button
        type="button"
        class="d-flex justify-content-between align-items-center w-100 border-0 bg-transparent p-0 fw-bold"
        (click)="isMenuOpen = !isMenuOpen">

        <span>Payment Method</span>

        <i class="bi bi-chevron-down"></i>

    </button>
    </h6>

    @if (selectedValue) {
      <div class="small text-muted mb-2">
          Selected:
          {{ selectedPaymentMethod?.brand }}
          {{ selectedPaymentMethod?.lastDigits }}
      </div>
    }


    <header class="collapse" [class.show]="isMenuOpen">
        <section class="row mb-3">
            @for (pm of paymentMethods(); track pm.id) {
                <main class="col-12 mb-2">
                    <button
                        type="button"
                        class="selectable-item w-100 text-start"
                        [class.selected]="selectedValue === pm.id"
                        (click)="selectPaymentMethod(pm.id)">

                        <div class="fw-semibold">
                        {{ pm.cardHolderName }}
                        </div>

                        <div class="small text-muted">
                        **** {{ pm.lastDigits }} • Exp {{ pm.expYear }}
                        </div>

                    </button>
                </main>
            }
        </section>

        @if (paymentMethods().length === 0) {
            <section class="text-center my-3">
                <p class="text-muted small mb-2">
                    You don’t have any saved payment method
                </p>
    
                <button (click)="goToCreate()"
                    class="btn btn-outline-primary d-flex align-items-center gap-2 mx-auto" >
                    <i class="bi bi-credit-card"></i>
                    Add new payment method
                </button>
    
            </section>
        }

    </header>



</main>
